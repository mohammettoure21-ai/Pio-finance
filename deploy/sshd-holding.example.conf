# INERTE — fragment a valider avec sshd -t APRES accord administrateur.
# Ne pas charger tel quel sans revue de la configuration existante.
# Le shell actuel nologin devra devenir /bin/sh pour la seule commande forcee.
# Aucun mot de passe SSH active, aucune cle root reutilisee.
Match User pio-holding
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/ssh/authorized_keys/pio-holding
    ForceCommand /usr/local/libexec/pio-holding-stdio
    DisableForwarding yes
    PermitTTY no
    PermitUserEnvironment no
Match all
